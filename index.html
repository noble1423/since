<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #14181f;
    --surface: #1d242f;
    --surface-2: #242c38;
    --text: #e9e5da;
    --text-dim: #8f98a3;
    --sage: #6fa37e;
    --gold: #c7a445;
    --rust: #a2583a;
    --divider: rgba(233, 229, 218, 0.09);
  }

  * { box-sizing: border-box; }

  body, .since-root {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
  }

  .since-root {
    padding: 32px 20px 60px;
    max-width: 880px;
    margin: 0 auto;
  }

  .since-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .since-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    font-optical-sizing: auto;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .since-tagline {
    font-size: 13.5px;
    color: var(--text-dim);
    margin: 4px 0 0;
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-weight: 400;
  }

  .add-btn {
    background: var(--surface);
    border: 1px solid var(--divider);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }
  .add-btn:hover { background: var(--surface-2); }
  .add-btn:active { transform: scale(0.97); }
  .add-btn:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }

  .since-divider {
    height: 1px;
    background: var(--divider);
    margin: 22px 0 26px;
  }

  .add-form {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 24px;
    display: none;
  }
  .add-form.open { display: block; }
  .add-form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .add-form input, .add-form select {
    background: var(--bg);
    border: 1px solid var(--divider);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .add-form input#f-name { flex: 1; min-width: 160px; }
  .add-form input#f-emoji { width: 60px; text-align: center; }
  .add-form select { min-width: 150px; }
  .add-form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .add-form-actions button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    border: 1px solid var(--divider);
  }
  .btn-save { background: var(--sage); color: #101410; border-color: transparent; }
  .btn-cancel { background: transparent; color: var(--text-dim); }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 14px;
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--sage);
    transition: background 0.4s ease;
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }

  .card-emoji { font-size: 20px; line-height: 1; }
  .card-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    flex: 1;
  }
  .card-del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 4px;
    opacity: 0.5;
    transition: opacity 0.15s ease;
  }
  .card-del:hover { opacity: 1; }

  .counter-wrap { perspective: 400px; }
  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 27px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transform-origin: center;
    transition: transform 0.35s cubic-bezier(.4,0,.2,1), opacity 0.35s ease;
  }
  .counter.flip {
    transform: rotateX(90deg);
    opacity: 0;
  }

  .counter-label {
    font-size: 11.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: -6px;
  }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }

  .cadence-note {
    font-size: 12px;
    color: var(--text-dim);
  }

  .log-btn {
    background: var(--surface-2);
    border: 1px solid var(--divider);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .log-btn:hover { background: var(--sage); color: #101410; }
  .log-btn:active { transform: scale(0.96); }
  .log-btn:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
  }

  .quiet-stats {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 34px;
    font-family: 'Fraunces', serif;
    font-style: italic;
  }

  /* --- Auth --- */
  .auth-wrap {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
  }
  .auth-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 4px;
    text-align: center;
  }
  .auth-sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
    font-family: 'Fraunces', serif;
    margin: 0 0 22px;
  }
  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .auth-field label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .auth-field input {
    background: var(--bg);
    border: 1px solid var(--divider);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    padding: 11px 12px;
    border-radius: 8px;
  }
  .auth-field input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .auth-error {
    color: var(--rust);
    font-size: 12.5px;
    margin: -4px 0 14px;
    min-height: 16px;
  }
  .auth-submit {
    width: 100%;
    background: var(--sage);
    color: #101410;
    border: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px;
    border-radius: 100px;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity 0.15s ease;
  }
  .auth-submit:active { opacity: 0.85; }
  .auth-toggle {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .auth-toggle button {
    background: none;
    border: none;
    color: var(--sage);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }
  .top-account {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .top-account button {
    background: none;
    border: 1px solid var(--divider);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 100px;
    cursor: pointer;
  }
  .top-account button:hover { color: var(--text); border-color: var(--text-dim); }
  .app-hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .counter, .add-btn, .log-btn, .card-del { transition: none !important; }
  }
</style>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">Since</h1>
    <p class="auth-sub" id="auth-mode-sub">sign in to your list</p>

    <div class="auth-field">
      <label for="auth-username">Username</label>
      <input id="auth-username" type="text" autocomplete="username" />
    </div>
    <div class="auth-field">
      <label for="auth-password">Password</label>
      <input id="auth-password" type="password" autocomplete="current-password" />
    </div>
    <div class="auth-field" id="auth-confirm-wrap" style="display:none;">
      <label for="auth-confirm">Confirm password</label>
      <input id="auth-confirm" type="password" autocomplete="new-password" />
    </div>

    <div class="auth-error" id="auth-error"></div>
    <button class="auth-submit" id="auth-submit">Sign in</button>

    <div class="auth-toggle">
      <span id="auth-toggle-text">New here?</span>
      <button id="auth-toggle-btn">Create an account</button>
    </div>
  </div>
</div>

<div id="since-root" class="since-root app-hidden">
  <div class="since-header">
    <div>
      <h1 class="since-title">Since</h1>
      <p class="since-tagline">for the things that quietly wait</p>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="top-account">
        <span id="account-label"></span>
        <button id="logout-btn">Log out</button>
      </div>
      <button class="add-btn" id="toggle-add">+ Add something</button>
    </div>
  </div>
  <div class="since-divider"></div>
  <div id="storage-warning" style="display:none; background: rgba(162,88,58,0.12); border: 1px solid var(--rust); color: var(--text); font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px;">
    Heads up: I couldn't reach storage just now, so your account and list may not be saved between visits. Everything still works for this session.
  </div>

  <div class="add-form" id="add-form">
    <div class="add-form-row">
      <input id="f-emoji" type="text" placeholder="🌱" maxlength="2" />
      <input id="f-name" type="text" placeholder="What do you want to keep an eye on?" />
      <select id="f-cadence">
        <option value="3">every few days</option>
        <option value="7" selected>about a week</option>
        <option value="14">couple weeks</option>
        <option value="30">about a month</option>
        <option value="90">every few months</option>
        <option value="365">once a year</option>
      </select>
    </div>
    <div class="add-form-actions">
      <button class="btn-cancel" id="cancel-add">Cancel</button>
      <button class="btn-save" id="save-add">Add it</button>
    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="quiet-stats" id="quiet-stats"></div>
</div>

<script>
(function () {
  const ACCOUNTS_KEY = 'since-accounts-v1';
  const SESSION_KEY = 'since-session-v1';
  const boardEl = document.getElementById('board');
  const statsEl = document.getElementById('quiet-stats');
  const toggleAddBtn = document.getElementById('toggle-add');
  const addForm = document.getElementById('add-form');
  const cancelBtn = document.getElementById('cancel-add');
  const saveBtn = document.getElementById('save-add');

  const authScreen = document.getElementById('auth-screen');
  const rootScreen = document.getElementById('since-root');
  const authUsername = document.getElementById('auth-username');
  const authPassword = document.getElementById('auth-password');
  const authConfirm = document.getElementById('auth-confirm');
  const authConfirmWrap = document.getElementById('auth-confirm-wrap');
  const authError = document.getElementById('auth-error');
  const authSubmit = document.getElementById('auth-submit');
  const authToggleBtn = document.getElementById('auth-toggle-btn');
  const authToggleText = document.getElementById('auth-toggle-text');
  const authModeSub = document.getElementById('auth-mode-sub');
  const accountLabel = document.getElementById('account-label');
  const logoutBtn = document.getElementById('logout-btn');

  const DAY = 86400000;
  let mode = 'signin'; // or 'signup'
  let currentUser = null;
  let lastStorageError = '';

  // Local storage wrapper — works standalone in any browser (e.g. hosted on GitHub Pages).
  // Data is saved per-browser/device only; there's no server, so it won't sync across devices.
  const localDB = {
    get(key) {
      try {
        const raw = window.localStorage.getItem(key);
        return raw === null ? null : { key, value: raw };
      } catch (e) {
        lastStorageError = (e && e.message) ? e.message : String(e);
        return null;
      }
    },
    set(key, value) {
      try {
        window.localStorage.setItem(key, value);
        return { key, value };
      } catch (e) {
        lastStorageError = (e && e.message) ? e.message : String(e);
        return null;
      }
    },
    delete(key) {
      try {
        window.localStorage.removeItem(key);
        return { key, deleted: true };
      } catch (e) {
        lastStorageError = (e && e.message) ? e.message : String(e);
        return null;
      }
    },
  };

  function itemsKeyFor(username) {
    return 'since-items:' + username.toLowerCase();
  }

  async function hashPassword(password, salt) {
    const enc = new TextEncoder();
    const data = enc.encode(salt + ':' + password);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function randomSalt() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16))).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function getAccounts() {
    try {
      const res = localDB.get(ACCOUNTS_KEY);
      return res && res.value ? JSON.parse(res.value) : {};
    } catch (e) {
      return {};
    }
  }

  async function saveAccounts(accounts) {
    try {
      if (!window.localStorage) {
        lastStorageError = 'localStorage is not available in this browser.';
        return false;
      }
      const result = localDB.set(ACCOUNTS_KEY, JSON.stringify(accounts));
      if (!result) {
        lastStorageError = lastStorageError || 'Could not save accounts.';
      }
      return !!result;
    } catch (e) {
      lastStorageError = (e && e.message) ? e.message : String(e);
      console.error('saveAccounts failed', e);
      return false;
    }
  }

  function setAuthError(msg) {
    authError.textContent = msg || '';
  }

  function setMode(next) {
    mode = next;
    setAuthError('');
    authPassword.value = '';
    authConfirm.value = '';
    if (mode === 'signup') {
      authModeSub.textContent = 'create your account';
      authConfirmWrap.style.display = 'flex';
      authSubmit.textContent = 'Create account';
      authToggleText.textContent = 'Already have an account?';
      authToggleBtn.textContent = 'Sign in instead';
    } else {
      authModeSub.textContent = 'sign in to your list';
      authConfirmWrap.style.display = 'none';
      authSubmit.textContent = 'Sign in';
      authToggleText.textContent = 'New here?';
      authToggleBtn.textContent = 'Create an account';
    }
  }

  authToggleBtn.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));

  authSubmit.addEventListener('click', async () => {
    const username = authUsername.value.trim();
    const password = authPassword.value;
    setAuthError('');

    if (!username || !password) {
      setAuthError('Enter a username and password.');
      return;
    }
    if (username.length < 2) {
      setAuthError('Username needs to be at least 2 characters.');
      return;
    }

    authSubmit.disabled = true;
    const originalLabel = authSubmit.textContent;
    authSubmit.textContent = 'Working…';

    try {
      const accounts = await getAccounts();
      const key = username.toLowerCase();

      if (mode === 'signup') {
        if (password !== authConfirm.value) {
          setAuthError('Passwords don\u2019t match.');
          return;
        }
        if (password.length < 4) {
          setAuthError('Password needs to be at least 4 characters.');
          return;
        }
        if (accounts[key]) {
          setAuthError('That username is taken. Try signing in instead.');
          return;
        }
        const salt = randomSalt();
        const hash = await hashPassword(password, salt);
        accounts[key] = { username, salt, hash };
        const saved = await saveAccounts(accounts);
        await logIn(username, !saved);
      } else {
        const account = accounts[key];
        if (!account) {
          setAuthError('No account with that username yet. Try creating one.');
          return;
        }
        const hash = await hashPassword(password, account.salt);
        if (hash !== account.hash) {
          setAuthError('Wrong password.');
          return;
        }
        await logIn(account.username);
      }
    } catch (err) {
      console.error('Auth error', err);
      setAuthError('Something went wrong (' + (err && err.message ? err.message : 'unknown error') + '). Please try again.');
    } finally {
      authSubmit.disabled = false;
      authSubmit.textContent = originalLabel;
    }
  });

  logoutBtn.addEventListener('click', async () => {
    currentUser = null;
    try {
      localDB.delete(SESSION_KEY);
    } catch (e) {}
    authScreen.classList.remove('app-hidden');
    rootScreen.classList.add('app-hidden');
    setMode('signin');
    authUsername.value = '';
    authPassword.value = '';
  });

  async function logIn(username, storageIssue) {
    currentUser = username;
    try {
      if (!window.localStorage) {
        throw new Error('localStorage is not available in this browser.');
      }
      localDB.set(SESSION_KEY, username);
    } catch (e) {
      console.error('Could not save session', e);
      lastStorageError = lastStorageError || ((e && e.message) ? e.message : String(e));
      storageIssue = true;
    }
    accountLabel.textContent = username;
    authScreen.classList.add('app-hidden');
    rootScreen.classList.remove('app-hidden');
    const warningEl = document.getElementById('storage-warning');
    if (warningEl) {
      if (storageIssue) {
        warningEl.style.display = 'block';
        warningEl.textContent = "Heads up: I couldn't reach storage just now (" + (lastStorageError || 'unknown reason') + "), so your account and list may not be saved between visits. Everything still works for this session.";
      } else {
        warningEl.style.display = 'none';
      }
    }
    await load();
  }

  async function tryAutoLogin() {
    try {
      const res = localDB.get(SESSION_KEY);
      if (res && res.value) {
        await logIn(res.value);
        return;
      }
    } catch (e) {}
    setMode('signin');
  }

  const defaultItems = () => [];

  let items = [];

  async function load() {
    if (!currentUser) return;
    try {
      const res = localDB.get(itemsKeyFor(currentUser));
      items = res && res.value ? JSON.parse(res.value) : defaultItems();
    } catch (e) {
      items = defaultItems();
    }
    render();
  }

  async function persist() {
    if (!currentUser) return;
    try {
      localDB.set(itemsKeyFor(currentUser), JSON.stringify(items));
    } catch (e) {
      console.error('Could not save', e);
    }
  }

  function formatSince(lastDone) {
    if (!lastDone) return '—';
    const ms = Date.now() - lastDone;
    const days = Math.floor(ms / DAY);
    const hours = Math.floor((ms % DAY) / 3600000);
    if (days === 0) {
      const mins = Math.floor((ms % 3600000) / 60000);
      return hours + 'h ' + mins + 'm';
    }
    return days + 'd ' + hours + 'h';
  }

  function cadenceLabel(days) {
    if (days <= 3) return 'every few days';
    if (days <= 7) return 'about a week';
    if (days <= 14) return 'couple weeks';
    if (days <= 30) return 'about a month';
    if (days <= 90) return 'every few months';
    return 'once a year';
  }

  function ratioOf(item) {
    if (!item.lastDone) return 999;
    const elapsedDays = (Date.now() - item.lastDone) / DAY;
    return elapsedDays / item.cadenceDays;
  }

  function colorFor(ratio) {
    if (ratio <= 1) return 'var(--sage)';
    if (ratio <= 2) return 'var(--gold)';
    return 'var(--rust)';
  }

  function render() {
    boardEl.innerHTML = '';
    if (items.length === 0) {
      boardEl.innerHTML = '<div class="empty-state">Nothing here yet. Add something you tend to forget.</div>';
      statsEl.textContent = '';
      return;
    }

    const sorted = [...items].sort((a, b) => ratioOf(b) - ratioOf(a));

    sorted.forEach((item) => {
      const ratio = ratioOf(item);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-bar" style="background:${colorFor(ratio)}"></div>
        <div class="card-top">
          <span class="card-emoji">${item.emoji || '•'}</span>
          <span class="card-name">${escapeHtml(item.name)}</span>
          <button class="card-del" title="Remove" data-id="${item.id}">✕</button>
        </div>
        <div class="counter-wrap">
          <div class="counter" id="counter-${item.id}" style="color:${colorFor(ratio)}">${formatSince(item.lastDone)}</div>
          <div class="counter-label">since last time</div>
        </div>
        <div class="card-bottom">
          <span class="cadence-note">usually ${cadenceLabel(item.cadenceDays)}</span>
          <button class="log-btn" data-id="${item.id}">Done today</button>
        </div>
      `;
      boardEl.appendChild(card);
    });

    boardEl.querySelectorAll('.log-btn').forEach((btn) => {
      btn.addEventListener('click', () => logItem(btn.dataset.id));
    });
    boardEl.querySelectorAll('.card-del').forEach((btn) => {
      btn.addEventListener('click', () => removeItem(btn.dataset.id));
    });

    const total = items.length;
    const fresh = items.filter((i) => ratioOf(i) <= 1).length;
    statsEl.textContent = `Keeping an eye on ${total} thing${total === 1 ? '' : 's'} — ${fresh} feeling fresh right now.`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function logItem(id) {
    const counterEl = document.getElementById('counter-' + id);
    if (counterEl) counterEl.classList.add('flip');
    setTimeout(() => {
      const item = items.find((i) => i.id === id);
      if (item) item.lastDone = Date.now();
      persist();
      render();
    }, 220);
  }

  function removeItem(id) {
    items = items.filter((i) => i.id !== id);
    persist();
    render();
  }

  toggleAddBtn.addEventListener('click', () => {
    addForm.classList.toggle('open');
  });
  cancelBtn.addEventListener('click', () => {
    addForm.classList.remove('open');
  });
  saveBtn.addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    const emoji = document.getElementById('f-emoji').value.trim() || '•';
    const cadenceDays = parseInt(document.getElementById('f-cadence').value, 10);
    if (!name) return;
    items.push({
      id: 'item-' + Date.now(),
      emoji,
      name,
      cadenceDays,
      lastDone: null,
    });
    document.getElementById('f-name').value = '';
    document.getElementById('f-emoji').value = '';
    addForm.classList.remove('open');
    persist();
    render();
  });

  tryAutoLogin();
  setInterval(() => { if (currentUser) render(); }, 60000);
})();
</script>
